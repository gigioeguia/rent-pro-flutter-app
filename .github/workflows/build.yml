name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify Flutter version matches .fvmrc
        run: |
          set -e
          EXPECTED=$(python3 -c "import json,sys; print(json.load(open('.fvmrc'))['flutter'])")
          ACTUAL=$(flutter --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "Expected (from .fvmrc): $EXPECTED"
          echo "Actual (flutter --version): $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify no signing material committed
        run: |
          set -e
          if git ls-files '*.jks' '*.keystore' | grep -q .; then
            echo "ERROR: keystore file tracked in git"
            git ls-files '*.jks' '*.keystore'
            exit 1
          fi
          if grep -n "123456789" android/app/build.gradle; then
            echo "ERROR: weak password hardcoded in build.gradle"
            exit 1
          fi
          echo "OK: no signing material committed"

      # (Opcional, activar cuando el mantenedor cargue los secrets)
      # - name: Decode keystore from secret
      #   env:
      #     ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      #   run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
      # - name: Build APK (release, signed)
      #   env:
      #     ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      #     ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #     ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     ANDROID_STORE_FILE: ../upload-keystore.jks
      #   run: flutter build apk --release

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
