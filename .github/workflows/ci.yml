name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  COVERAGE_THRESHOLD: '2'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify Flutter version matches .fvmrc
        run: |
          set -e
          EXPECTED=$(python3 -c "import json,sys; print(json.load(open('.fvmrc'))['flutter'])")
          ACTUAL=$(flutter --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "Expected (from .fvmrc): $EXPECTED"
          echo "Actual (flutter --version): $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: flutter test --coverage

      - name: Coverage check
        if: matrix.os == 'ubuntu-latest'
        run: dart run tool/coverage_report.dart --threshold=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # iOS build movido a .github/workflows/ios-build.yml (manual/tags)

  quality-gate:
    name: quality-gate
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.analyze-and-test.result }}" != "success" ]; then
            echo "analyze-and-test failed: ${{ needs.analyze-and-test.result }}"
            exit 1
          fi
